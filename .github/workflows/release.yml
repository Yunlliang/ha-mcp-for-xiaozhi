name: Upload ZIP to Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created]  # 当创建 Release 时触发
permissions:
  contents: write   # 关键：赋予写 release 资源的权限

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      #检查tag
      - name: Validate tag format
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "Error: Tag must be in format v#.#.# (e.g., v1.0.0)"
            exit 1
          fi
          echo "Tag format is valid: $GITHUB_REF"

      - name: Get version from tag
        id: get_version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "Current ref: $GITHUB_REF"
          echo "Tag name: ${GITHUB_REF#refs/tags/}"
          
      # 更新manifest
      - name: Update manifest version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" custom_components/ws_mcp_server/manifest.json
          echo "Updated manifest version to: $VERSION"
          cat custom_components/ws_mcp_server/manifest.json


      # 2. 创建 ZIP 文件（排除不需要的目录/文件）
      - name: Create ZIP
        run: |
          echo "Creating ZIP file..."
          cd custom_components/ws_mcp_server
          zip -r ../../ha-mcp-for-xiaozhi.zip . -x "__pycache__/*" "*.pyc"
          cd ../..
          echo "ZIP file created:"
          ls -la ha-mcp-for-xiaozhi.zip
          echo "ZIP file contents:"
          unzip -l ha-mcp-for-xiaozhi.zip
          
      # Tags publish a release so HACS can discover the update.
      - name: Create release for tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.get_version.outputs.TAG_NAME }}
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --verify-tag --title "$TAG_NAME" --generate-notes
          fi

      # 3. 上传 ZIP 到 Release
      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.get_version.outputs.TAG_NAME }}
        run: gh release upload "$TAG_NAME" ha-mcp-for-xiaozhi.zip --clobber
